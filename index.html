<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>话语官网</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(56, 189, 248, 0.18), transparent 28%),
      radial-gradient(circle at 80% 20%, rgba(129, 140, 248, 0.18), transparent 30%),
      radial-gradient(circle at 50% 90%, rgba(99, 102, 241, 0.22), transparent 36%),
      linear-gradient(180deg, #05070d 0%, #070b18 48%, #081024 100%);
    color: #e6f1ff;
    position: relative;
  }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  /* 外层一整个大卡牌 */
  .outer-big-card {
    position: relative;
    z-index: 2;
    margin: 12px 12px 14px;
    padding: 14px 16px 18px;
    border-radius: 26px;
    background:
      linear-gradient(160deg,
        rgba(14, 24, 48, 0.52) 0%,
        rgba(22, 34, 64, 0.32) 100%);
    border: 1px solid rgba(148, 163, 184, 0.18);
    box-shadow:
      0 10px 40px rgba(15, 23, 42, 0.6),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }

  .outer-big-card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 26px;
    padding: 1px;
    background: linear-gradient(140deg,
      rgba(148, 163, 184, 0.38),
      rgba(125, 211, 252, 0.22),
      rgba(129, 140, 248, 0.14),
      transparent 45%);
    -webkit-mask: linear-gradient(#000 0 0) content-box,
                 linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  /* 顶部两个独立小标签 */
  .top-tags {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .mini-tag {
    position: relative;
    padding: 5px 11px;
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.22);
    font-size: 11px;
    letter-spacing: 2px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #cbd5e1;
  }

  .mini-tag.right {
    color: #a5b4fc;
  }

  .mini-tag .dot-icon {
    font-size: 12px;
    line-height: 1;
    color: #38bdf8;
    filter: drop-shadow(0 0 7px rgba(56, 189, 248, 0.75));
  }

  .mini-tag.right::before {
    content: "";
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 8px rgba(74, 222, 128, 0.5);
  }

  .top-divider {
    position: relative;
    z-index: 1;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(148, 163, 184, 0.4),
      rgba(125, 211, 252, 0.22),
      transparent);
    margin-bottom: 12px;
  }

  .container {
    position: relative;
    z-index: 2;
    padding: 0 18px 40px;
  }

  /* 标题区：加强流光与发光 */
  .title-wrap {
    text-align: center;
    margin-bottom: 16px;
  }

  h1 {
    font-size: 44px;
    font-weight: 800;
    letter-spacing: 8px;
    background: linear-gradient(90deg,
      #38bdf8 0%,
      #e0f2fe 20%,
      #7dd3fc 35%,
      #818cf8 50%,
      #e0f2fe 65%,
      #38bdf8 80%,
      #818cf8 100%);
    background-size: 220% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 3s linear infinite;
    filter: drop-shadow(0 0 16px rgba(125, 211, 252, 0.65));
    margin-bottom: 10px;
  }

  @keyframes shine {
    to {
      background-position: 220% center;
    }
  }

  /* 呼吸灯：加强亮度、尺寸变化和蓝紫脉冲 */
  .breathing-bar {
    position: relative;
    height: 4px;
    margin: 10px auto 0;
    width: 44%;
    max-width: 280px;
    border-radius: 999px;
    background: linear-gradient(90deg,
      transparent,
      rgba(56, 189, 248, 0.85),
      rgba(125, 211, 252, 0.95),
      rgba(129, 140, 248, 0.85),
      transparent);
    filter: blur(0.8px);
    animation: breathe 2s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% {
      transform: scaleX(0.45);
      opacity: 0.5;
      box-shadow:
        0 0 10px rgba(56, 189, 248, 0.55),
        0 0 24px rgba(125, 211, 252, 0.35),
        0 0 40px rgba(129, 140, 248, 0.25);
    }
    50% {
      transform: scaleX(1);
      opacity: 1;
      box-shadow:
        0 0 18px rgba(56, 189, 248, 0.95),
        0 0 36px rgba(125, 211, 252, 0.75),
        0 0 60px rgba(129, 140, 248, 0.55);
    }
  }

  .sub-title {
    font-size: 12px;
    letter-spacing: 7px;
    color: #a5b4fc;
    text-shadow: 0 0 10px rgba(129, 140, 248, 0.55);
  }

  .sub-title span {
    margin: 0 8px;
    color: #c7d2fe;
  }

  /* 三张按钮卡片 */
  .grid-box {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 11px;
  }
  .card-link{
    text-decoration: none;
  }
  .card {
    position: relative;
    background: linear-gradient(160deg,
      rgba(15, 23, 42, 0.55) 0%,
      rgba(30, 41, 59, 0.35) 100%);
    border: 1px solid rgba(148, 163, 184, 0.22);
    border-radius: 20px;
    padding: 14px 12px;
    text-align: center;
    cursor: pointer;
    overflow: hidden;
    box-shadow:
      0 10px 24px rgba(15, 23, 42, 0.55),
      inset 0 1px 0 rgba(255, 255, 255, 0.06),
      inset 0 -6px 18px rgba(0, 0, 0, 0.35);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .card:hover {
    transform: translateY(-4px);
    box-shadow:
      0 14px 30px rgba(15, 23, 42, 0.7),
      0 0 0 1px rgba(125, 211, 252, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 20px;
    padding: 1px;
    background: linear-gradient(140deg,
      rgba(148, 163, 184, 0.35),
      rgba(125, 211, 252, 0.18),
      transparent 40%);
    -webkit-mask: linear-gradient(#000 0 0) content-box,
                 linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
  }

  .card .icon {
    font-size: 30px;
    margin-bottom: 7px;
    filter: drop-shadow(0 0 12px rgba(125, 211, 252, 0.75));
  }

  .card .name {
    font-size: 15px;
    font-weight: 700;
    color: #e0f2fe;
    margin-bottom: 3px;
    text-shadow: 0 0 10px rgba(125, 211, 252, 0.55);
  }

  .card .desc {
    font-size: 11px;
    color: #94a3b8;
    letter-spacing: 2px;
  }

  .card-full {
    grid-column: 1 / -1;
  }

  /* 公告区：加强蓝紫脉冲变色 */
  .notice-box {
    background: linear-gradient(160deg,
      rgba(14, 24, 52, 0.48) 0%,
      rgba(28, 38, 80, 0.26) 100%);
    border: 1px solid rgba(148, 163, 184, 0.18);
    border-radius: 22px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    animation: noticeColor 4.5s ease-in-out infinite;
  }

  @keyframes noticeColor {
    0%, 100% {
      box-shadow:
        0 0 22px rgba(56, 189, 248, 0.22),
        0 0 40px rgba(56, 189, 248, 0.12),
        inset 0 0 22px rgba(56, 189, 248, 0.08);
      border-color: rgba(125, 211, 252, 0.28);
    }
    50% {
      box-shadow:
        0 0 32px rgba(129, 140, 248, 0.38),
        0 0 60px rgba(129, 140, 248, 0.22),
        inset 0 0 32px rgba(129, 140, 248, 0.16);
      border-color: rgba(129, 140, 248, 0.45);
    }
  }

  .notice-box::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(90deg,
      transparent,
      rgba(148, 163, 184, 0.38),
      rgba(125, 211, 252, 0.22),
      transparent);
  }

  .notice-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    gap: 10px;
  }

  .notice-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: #7dd3fc;
    letter-spacing: 2px;
    flex: 1;
  }

  .bell-icon {
    font-size: 15px;
    line-height: 1;
    color: #fbbf24;
    filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.55));
  }

  .star-icon {
    font-size: 13px;
    line-height: 1;
    color: rgba(253, 230, 138, 0.45);
    filter: drop-shadow(0 0 4px rgba(253, 230, 138, 0.4));
  }

  .notice-head .tag {
    font-size: 11px;
    line-height: 1;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.12);
    color: #cbd5e1;
    border: 1px solid rgba(148, 163, 184, 0.25);
    white-space: nowrap;
    letter-spacing: 2px;
  }

  .notice-content {
    font-size: 12px;
    line-height: 1.95;
    color: #cbd5e1;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .notice-content p {
    display: block;
    width: 100%;
  }

  .red-highlight {
    color: #fca5a5;
    font-weight: 600;
  }

  .agree-highlight {
    color: #fcd34d;
    font-weight: 600;
    text-shadow: 0 0 10px rgba(252, 211, 77, 0.45);
  }

  .notice-footer {
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid rgba(148, 163, 184, 0.18);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .copy {
    font-size: 11px;
    color: #64748b;
    text-align: center;
    letter-spacing: 1px;
  }

  .foot-nav {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #94a3b8;
    letter-spacing: 2px;
  }

  .foot-nav span {
    opacity: 0.8;
  }
</style>
</head>

<script>
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  let particles = [];
  let w, h;

  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }

  function createParticles() {
    particles = [];
    const count = Math.min(180, Math.floor((w * h) / 11000));
    for (let i = 0; i < count; i++) {
      particles.push({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.2 + 0.3,
        vx: (Math.random() - 0.5) * 0.22,
        vy: (Math.random() - 0.5) * 0.22,
        alpha: Math.random() * 0.4 + 0.12,
        color: Math.random() > 0.5 ? "125, 211, 252" : "129, 140, 248"
      });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach((p, i) => {
      p.x += p.vx;
      p.y += p.vy;
      if (p.x < 0) p.x = w;
      if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h;
      if (p.y > h) p.y = 0;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.color}, ${p.alpha})`;
      ctx.shadowBlur = 6;
      ctx.shadowColor = `rgba(${p.color}, 0.6)`;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const p2 = particles[j];
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 90) {
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = `rgba(125, 211, 252, ${0.14 * (1 - dist / 90)})`;
          ctx.lineWidth = 0.5;
          ctx.shadowBlur = 0;
          ctx.stroke();
        }
      }
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener("resize", () => {
    resize();
    createParticles();
  });

  resize();
  createParticles();
  draw();
</script>
